<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0d1014">
<title>C108 巡回リスト</title>
<style>
:root{
  --bg:#0d1014; --panel:#161b22; --panel2:#1d242e; --line:#2b3440;
  --ink:#e9edf3; --mute:#8b98ab; --dim:#5d6b7d;
  --zettai:#ff3d68; --dekireba:#ffa724; --maamaa:#63798f; --etc:#4a5766;
  --ok:#25c463; --gone:#7a4a55; --skipc:#3d4652;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;overscroll-behavior-x:none}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.4;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
body.light{
  --bg:#f2f4f7;--panel:#fff;--panel2:#e8ecf1;--line:#d3dae3;
  --ink:#101720;--mute:#5b6878;--dim:#8b98ab;
}

/* ---- header ---- */
header{
  position:sticky;top:0;z-index:30;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 8px) 10px 0;
  border-bottom:1px solid var(--line);
}
.tabs{display:flex;gap:6px}
.tab{
  flex:1;padding:11px 4px;text-align:center;font-weight:700;font-size:15px;
  background:var(--panel);color:var(--mute);border:1px solid var(--line);
  border-bottom:none;border-radius:9px 9px 0 0;cursor:pointer;
}
.tab.on{background:var(--panel2);color:var(--ink)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 0}
.count{font-size:13px;color:var(--mute);flex:1;font-variant-numeric:tabular-nums}
.count b{color:var(--zettai);font-size:16px}
.mini{
  background:var(--panel);border:1px solid var(--line);color:var(--mute);
  padding:7px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
}
.mini.on{color:var(--ink);border-color:var(--dim)}
#q{
  width:100%;padding:9px 11px;margin-bottom:8px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:16px;
}

/* ---- list ---- */
main{padding:10px 10px 96px}
.hall{
  display:flex;align-items:baseline;gap:8px;
  margin:18px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--line);
}
.hall b{font-size:17px;letter-spacing:.04em}
.hall span{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.row{
  display:flex;align-items:center;gap:10px;touch-action:pan-y;
  padding:10px 10px;margin-bottom:6px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);
  border-left:5px solid var(--etc);cursor:pointer;
}
.row.p0{border-left-color:var(--zettai)}
.row.p1{border-left-color:var(--dekireba)}
.row.p2{border-left-color:var(--maamaa)}
.chip{
  min-width:74px;text-align:center;padding:7px 4px;border-radius:7px;
  background:var(--panel2);border:1px solid var(--line);
  font-weight:800;font-size:16px;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.body{flex:1;min-width:0}
.nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm.none{color:var(--dim);font-weight:400}
.sub{font-size:11.5px;color:var(--mute);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.t{font-variant-numeric:tabular-nums;font-weight:700}
.t.e{color:var(--zettai)} .t.m{color:var(--dekireba)} .t.l{color:var(--mute)}
.st{
  min-width:52px;text-align:center;font-size:10.5px;font-weight:800;line-height:1.25;
  padding:6px 2px;border-radius:6px;background:var(--panel2);color:var(--dim);
}
.row.s1{opacity:.55} .row.s1 .st{background:var(--ok);color:#04220f}
.row.s2{opacity:.5}  .row.s2 .st{background:#3f5a86;color:#d6e4ff}
.row.s3{opacity:.42} .row.s3 .st{background:var(--gone);color:#ffd9e0}
.row.s4{opacity:.32} .row.s4 .st{background:var(--skipc);color:var(--mute)}
.empty{color:var(--dim);text-align:center;padding:40px 10px;font-size:14px}
.cbadge{
  display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:800;
  background:#3a2f10;color:#ffd98a;border:1px solid #6b5520;margin-right:6px;flex-shrink:0;
}
.mv{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.mv button{
  width:36px;height:26px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:13px;font-weight:800;
  cursor:pointer;padding:0;line-height:1;
}
.mv button:disabled{opacity:.3}
.onum{
  min-width:26px;text-align:center;font-size:12px;font-weight:800;color:var(--mute);
  font-variant-numeric:tabular-nums;flex-shrink:0;
}

/* ---- 相対軸（右ボーダー）：残り時間で色が変わる ---- */
.row{border-right:5px solid transparent}
.row.u1{border-right-color:#ffd21f}  /* 注意：残り30〜60分 */
.row.u2{border-right-color:#ff3d68}  /* 危険：残り30分未満 */
.row.u3{border-right-color:#a855f7}  /* 目安超過 */
.rem{font-weight:800;font-variant-numeric:tabular-nums}
.rem.u1{color:#ffd21f}
.rem.u2{color:#ff3d68}
.rem.u3{color:#c084fc}
.badge{
  display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:800;
  background:#2a3d29;color:#a8e6a1;border:1px solid #3d5a3b;margin-right:6px;flex-shrink:0;
}
.oshi{margin-top:10px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.oshi img{
  height:190px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);flex-shrink:0;cursor:zoom-in;
}
.thumb{
  width:46px;height:46px;object-fit:cover;border-radius:6px;
  border:1px solid var(--line);flex-shrink:0;background:var(--panel2);
}
.viewer{
  position:fixed;inset:0;z-index:80;background:#000;display:none;
  align-items:center;justify-content:center;touch-action:none;overscroll-behavior:none;
}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.vpage{
  position:fixed;bottom:calc(env(safe-area-inset-bottom) + 16px);left:50%;
  transform:translateX(-50%);z-index:81;
  background:rgba(40,40,40,.85);color:#fff;padding:7px 16px;border-radius:20px;
  font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;display:none;
}
.vnav{
  position:fixed;top:50%;transform:translateY(-50%);z-index:81;
  width:48px;height:64px;border:none;border-radius:10px;
  background:rgba(40,40,40,.7);color:#fff;font-size:24px;font-weight:700;
  cursor:pointer;display:none;
}
.vnav.l{left:8px} .vnav.r{right:8px}
body.noscroll{overflow:hidden;position:fixed;width:100%}
.vclose{
  position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:81;
  width:44px;height:44px;border-radius:50%;border:none;
  background:rgba(40,40,40,.85);color:#fff;font-size:22px;font-weight:700;cursor:pointer;
}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(102%);
  transition:transform .18s ease-out;
  background:var(--panel);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 16px);
  max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh .chip{font-size:19px;min-width:88px;padding:9px 6px}
.sh .nm{font-size:17px;white-space:normal}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{
  padding:16px 6px;border-radius:10px;font-size:15px;font-weight:800;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  text-align:center;cursor:pointer;
}
.btn.sel{outline:2px solid var(--ink);outline-offset:-2px}
.btn.b1{background:#123d24;border-color:#1d6b3c;color:#8ef0b4}
.btn.b2{background:#3d1622;border-color:#6b2a3c;color:#ffb3c4}
.btn.b3{background:var(--panel2);color:var(--mute)}
.btn.wide{grid-column:1/-1}
.lnk{
  display:block;margin-top:8px;padding:14px;border-radius:10px;text-align:center;
  background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;
}
.lnk.off{color:var(--dim);pointer-events:none}
textarea,input[type=text]{
  width:100%;margin-top:8px;padding:11px;border-radius:9px;font-size:16px;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  font-family:inherit;
}
label.f{display:block;font-size:12px;color:var(--mute);margin-top:12px;font-weight:600}
.hint{font-size:12px;color:var(--dim);margin-top:6px}

/* ---- add tab ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.add{width:100%;padding:15px;margin-top:14px;border-radius:10px;font-size:16px;font-weight:800;
  background:var(--ok);color:#04220f;border:none;cursor:pointer}
.add:disabled{background:var(--panel2);color:var(--dim)}
.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:var(--panel2);
  font-size:11px;color:var(--mute);margin-right:5px}
pre{
  white-space:pre-wrap;word-break:break-all;background:var(--panel2);
  border:1px solid var(--line);border-radius:9px;padding:11px;font-size:11.5px;
  max-height:46vh;overflow:auto;color:var(--ink);
}
:focus-visible{outline:2px solid #6ea8ff;outline-offset:2px}
</style>
</head>

const KEY = 'c108_v2';
const OLDKEY = 'c108_v1';
const PR = {'絶対':0,'できれば':1,'まあまあ':2,'未分類':3,'未設定':4};
const HALLS = ['東1-3','東7','西','南','不明'];
const ST = ['未購入','購入済','委託した','完売','スキップ'];
const STS = ['未','購入済','委託','完売','スキップ'];  // 一覧の小さいバッジ用
// 「委託受け」は状況とは独立したフラグ（受けた上で購入済、が表現できるように）

let db = load();
let tab = 'Day1', sortMode = 'place', hideDone = false, query = '';

function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY));
    if(r && r.status){
      r.consign = r.consign || {};   // {id: '名前'}（空文字なら名前未入力）
      r.names = r.names || [];       // 入力済みの委託者名の候補
      r.order = r.order || {};       // ▲▼で動かした巡回順
      return r;
    }
  }catch(e){}
  // 旧バージョン(c108_v1)からの引き継ぎ
  // 旧: 0未購入 1確保 2完売 3スキップ → 新: 0未購入 1購入済 2委託した 3完売 4スキップ
  try{
    const o = JSON.parse(localStorage.getItem(OLDKEY));
    if(o && o.status){
      const map = {0:0, 1:1, 2:3, 3:4};
      const st = {};
      for(const k in o.status) st[k] = map[o.status[k]] !== undefined ? map[o.status[k]] : 0;
      return {status:st, memo:o.memo||{}, added:o.added||[], consign:{}, names:[], order:{}};
    }
  }catch(e){}
  return {status:{}, memo:{}, added:[], consign:{}, names:[], order:{}};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert('保存に失敗しました。空き容量を確認してください。'); }
}

/* ---------- rendering ---------- */
function timeClass(t){
  if(!t) return '';
  const h = parseInt(t.split(':')[0],10);
  if(isNaN(h)) return '';
  return h < 12 ? 'e' : h < 13 ? 'm' : 'l';
}
function matches(r){
  if(!query) return true;
  const q = query.toLowerCase();
  return (r.p+' '+r.n).toLowerCase().includes(q);
}
function reindexAdded(removedIdx){
  const shift = (obj) => {
    const out = {};
    for(const k in obj){
      if(!k.startsWith('add-')){ out[k] = obj[k]; continue; }
      const i = +k.split('-')[1];
      if(i === removedIdx) continue;
      out['add-' + (i > removedIdx ? i - 1 : i)] = obj[k];
    }
    return out;
  };
  db.status = shift(db.status);
  db.memo = shift(db.memo);
  db.consign = shift(db.consign);
  if(db.order) db.order = shift(db.order);
}
function addedAsRows(){
  return db.added.map((a,i) => ({
    id: 'add-' + i,
    p: a.p, n: a.n, d: a.d, h: a.h || '不明',
    pr: a.pr || 'まあまあ', sell: '', memo: '', buy: '', url: '',
    blk: (a.p.match(/^([^0-9]+)/)||['',''])[1].trim(),
    num: parseInt((a.p.match(/(\d+)/)||['','0'])[1],10) || 0,
    sfx: (a.p.match(/(\d+)([a-zA-Z]*)$/)||['','',''])[2] || '',
    added: true,
  }));
}
function allRows(){ return DATA.concat(addedAsRows()); }

/* ---------- 巡回順 ----------
   優先順位： ①端末で▲▼した値  ②Notionの「巡回順」列  ③ホール内・優先度順の自動計算
   ③は毎回計算するので、サークルが増減しても破綻しない。 */
function baseOrderMap(day){
  const map = {};
  const byHall = {};
  for(const r of allRows()){
    if(r.d !== day) continue;
    (byHall[r.h] = byHall[r.h] || []).push(r);
  }
  for(const h in byHall){
    byHall[h]
      .sort((a,b) => PR[a.pr]-PR[b.pr]
        || a.blk.localeCompare(b.blk,'ja') || a.num-b.num || a.sfx.localeCompare(b.sfx))
      .forEach((r,i) => { map[r.id] = i + 1; });
  }
  return map;
}
function orderOf(r, base){
  if(db.order && db.order[r.id] !== undefined) return db.order[r.id];
  if(r.ord !== undefined && r.ord !== null && r.ord !== '') return Number(r.ord);
  return base[r.id] || 9999;
}
function rowsFor(day){
  let rs = allRows().filter(r => r.d === day && matches(r));
  if(sortMode === 'place'){
    rs.sort((a,b) => HALLS.indexOf(a.h)-HALLS.indexOf(b.h)
      || a.blk.localeCompare(b.blk,'ja') || a.num-b.num || a.sfx.localeCompare(b.sfx));
  }else if(sortMode === 'pri'){
    rs.sort((a,b) => HALLS.indexOf(a.h)-HALLS.indexOf(b.h)
      || PR[a.pr]-PR[b.pr]
      || a.blk.localeCompare(b.blk,'ja') || a.num-b.num || a.sfx.localeCompare(b.sfx));
  }else{
    const base = baseOrderMap(day);
    rs.sort((a,b) => HALLS.indexOf(a.h)-HALLS.indexOf(b.h)
      || orderOf(a,base)-orderOf(b,base)
      || a.blk.localeCompare(b.blk,'ja') || a.num-b.num);
  }
  return rs;
}
/* ▲▼で入れ替え。ホール内でのみ動かす */
function moveRow(id, dir){
  const r = allRows().find(x => x.id === id);
  if(!r) return;
  const base = baseOrderMap(tab);
  const group = allRows()
    .filter(x => x.d === tab && x.h === r.h)
    .sort((a,b) => orderOf(a,base)-orderOf(b,base)
      || a.blk.localeCompare(b.blk,'ja') || a.num-b.num);
  const i = group.findIndex(x => x.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= group.length) return;
  const tmp = group[i]; group[i] = group[j]; group[j] = tmp;
  db.order = db.order || {};
  group.forEach((x,k) => { db.order[x.id] = k + 1; });  // ホール内を1から振り直す
  save(); render();
}
/* ---------- 相対軸（現在時刻との距離） ---------- */
const OPEN_MIN = 10 * 60 + 30;   // 開場 10:30
const CLOSE_MIN = 15 * 60;       // 閉場 15:00
const EVENT_DATES = { 'Day1': '2026-08-15', 'Day2': '2026-08-16' };

// 動作確認用：?test=Day1@11:40 のように指定すると、その日時として扱う
const TEST = (function(){
  const m = location.search.match(/[?&]test=(Day[12])@(\d{1,2}):(\d{2})/);
  return m ? { day: m[1], min: (+m[2]) * 60 + (+m[3]) } : null;
})();

function nowMin(){
  const d = new Date();
  return { min: d.getHours() * 60 + d.getMinutes(), date: fmtDate(d) };
}
function fmtDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
    + '-' + String(d.getDate()).padStart(2,'0');
}
// 相対軸を動かしてよい状況か（今日がそのDayで、かつ会期時間内）
function liveFor(day){
  if(TEST){
    if(TEST.day !== day) return null;
    return (TEST.min < OPEN_MIN || TEST.min > CLOSE_MIN) ? null : TEST.min;
  }
  const n = nowMin();
  if(EVENT_DATES[day] !== n.date) return null;
  if(n.min < OPEN_MIN || n.min > CLOSE_MIN) return null;
  return n.min;
}

function urgency(row, live){
  if(live === null || !row.sell) return { u:0, label:'' };
  const m = row.sell.match(/^(\d{1,2}):(\d{2})/);
  if(!m) return { u:0, label:'' };
  const target = (+m[1]) * 60 + (+m[2]);
  const diff = target - live;
  if(diff < 0) return { u:3, label:'目安超過' };
  if(diff < 30) return { u:2, label:'あと' + diff + '分' };
  if(diff < 60) return { u:1, label:'あと' + diff + '分' };
  return { u:0, label:'' };
}

function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
  document.getElementById('ctl').style.display = tab === 'ADD' ? 'none' : '';
  const main = document.getElementById('main');

  if(tab === 'ADD'){ main.innerHTML = addHTML(); bindAdd(); return; }

  const rs = rowsFor(tab);
  const all = allRows().filter(r => r.d === tab);
  const z = all.filter(r => r.pr === '絶対');
  const zLeft = z.filter(r => (db.status[r.id]||0) === 0).length;
  const done = all.filter(r => (db.status[r.id]||0) !== 0).length;
  document.getElementById('count').innerHTML =
    `絶対 残り <b>${zLeft}</b>/${z.length}　・　全体 ${done}/${all.length}`;

  let html = '', hall = null;
  const live = liveFor(tab);
  const ordMode = (sortMode === 'ord');
  const base = ordMode ? baseOrderMap(tab) : null;
  const vis = rs.filter(r => !(hideDone && (db.status[r.id]||0) !== 0));
  if(!vis.length){ main.innerHTML = '<div class="empty">該当する行がありません</div>'; return; }
  for(const r of vis){
    if(r.h !== hall){
      hall = r.h;
      const n = vis.filter(x => x.h === hall).length;
      html += `<div class="hall"><b>${esc(hall)}</b><span>${n}件</span></div>`;
    }
    const s = db.status[r.id]||0;
    const tc = timeClass(r.sell);
    // 済・完売・スキップ済の行は急かさない
    const ug = (s === 0) ? urgency(r, live) : { u:0, label:'' };
    const sub = [];
    if(r.sell) sub.push(`<span class="t ${tc}">～${esc(r.sell)}</span>`);
    if(ug.label) sub.push(`<span class="rem u${ug.u}">${esc(ug.label)}</span>`);
    sub.push(`<span>${esc(r.pr)}</span>`);
    if(r.url) sub.push('<span>X</span>');
    if(db.memo[r.id]) sub.push('<span>メモ</span>');
    const img = (r.img && r.img.length)
      ? `<img class="thumb" src="${encodeURIComponent(r.img[0])}" alt="" loading="lazy">` : '';
    const con = Object.prototype.hasOwnProperty.call(db.consign, r.id)
      ? `<span class="cbadge">委託${db.consign[r.id] ? '・' + esc(db.consign[r.id]) : ''}</span>` : '';
    html += `<div class="row p${Math.min(PR[r.pr],3)} s${s}${ug.u?' u'+ug.u:''}" data-id="${esc(r.id)}">
      ${ordMode ? `<div class="onum">${orderOf(r, base)}</div>` : ''}
      <div class="chip">${esc(r.p)}</div>
      <div class="body">
        <div class="nm${r.n?'':' none'}">${r.added?'<span class="badge">追加</span>':''}${con}${esc(r.n||'（名称未取得）')}</div>
        <div class="sub">${sub.join('')}</div>
      </div>
      ${ordMode ? '' : img}
      ${ordMode
        ? `<div class="mv"><button data-mv="up">▲</button><button data-mv="down">▼</button></div>`
        : `<div class="st">${STS[s]}</div>`}
    </div>`;
  }
  main.innerHTML = html;
  main.querySelectorAll('.row').forEach(el => {
    if(ordMode){
      // 並び替え中はスワイプを無効化（誤操作防止）
      el.querySelectorAll('[data-mv]').forEach(b =>
        b.addEventListener('click', ev => {
          ev.stopPropagation();
          moveRow(el.dataset.id, b.dataset.mv === 'up' ? -1 : 1);
        }));
      el.addEventListener('click', () => openSheet(el.dataset.id));
    }else{
      bindRow(el);
    }
  });
}

/* ---------- 行のスワイプ（右=購入済 / 左=完売） ---------- */
function bindRow(el){
  const id = el.dataset.id;
  let x0 = null, y0 = null, dragging = false, decided = false;

  el.addEventListener('click', () => { if(!dragging) openSheet(id); });

  el.addEventListener('touchstart', e => {
    if(e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    dragging = false; decided = false;
    el.style.transition = 'none';
  }, {passive:true});

  el.addEventListener('touchmove', e => {
    if(x0 === null || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if(!decided){
      // 縦スクロールが主なら以後スワイプ扱いしない
      if(Math.abs(dy) > Math.abs(dx)){ x0 = null; return; }
      if(Math.abs(dx) < 10) return;
      decided = true;
    }
    dragging = true;
    const shift = Math.max(-110, Math.min(110, dx));
    el.style.transform = 'translateX(' + shift + 'px)';
    el.style.opacity = 1 - Math.min(0.35, Math.abs(shift) / 320);
  }, {passive:true});

  const reset = () => {
    el.style.transition = 'transform .16s ease-out, opacity .16s ease-out';
    el.style.transform = ''; el.style.opacity = '';
  };

  el.addEventListener('touchend', e => {
    if(x0 === null){ reset(); return; }
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if(dragging && Math.abs(dx) > 70){
      const target = dx > 0 ? 1 : 3;              // 1=購入済 3=完売
      const now = db.status[id] || 0;
      db.status[id] = (now === target) ? 0 : target;  // 同じ操作で取り消し
      save(); reset();
      if(navigator.vibrate) navigator.vibrate(12);
      setTimeout(render, 160);
      return;
    }
    reset();
    // 小さな動きはタップとして扱う
    setTimeout(() => { dragging = false; }, 0);
  });

  el.addEventListener('touchcancel', () => { x0 = null; reset(); });
}

let vList = [], vIdx = 0;
function openViewer(list, idx){
  vList = list; vIdx = idx;
  lockBody();
  document.getElementById('viewer').classList.add('on');
  document.getElementById('vclose').style.display = 'block';
  showViewer();
}
function showViewer(){
  document.getElementById('vimg').src = encodeURIComponent(vList[vIdx]);
  const multi = vList.length > 1;
  const pg = document.getElementById('vpage');
  pg.style.display = multi ? 'block' : 'none';
  pg.textContent = (vIdx + 1) + ' / ' + vList.length;
  document.getElementById('vprev').style.display = multi ? 'block' : 'none';
  document.getElementById('vnext').style.display = multi ? 'block' : 'none';
}
function vStep(d){
  if(vList.length < 2) return;
  vIdx = (vIdx + d + vList.length) % vList.length;
  showViewer();
}
function closeViewer(){
  document.getElementById('viewer').classList.remove('on');
  document.getElementById('vclose').style.display = 'none';
  document.getElementById('vpage').style.display = 'none';
  document.getElementById('vprev').style.display = 'none';
  document.getElementById('vnext').style.display = 'none';
  document.getElementById('vimg').src = '';
  unlockBody();
}
document.getElementById('vclose').addEventListener('click', closeViewer);
document.getElementById('vprev').addEventListener('click', e => { e.stopPropagation(); vStep(-1); });
document.getElementById('vnext').addEventListener('click', e => { e.stopPropagation(); vStep(1); });

// 画像のスワイプ切替
(function(){
  const v = document.getElementById('viewer');
  let x0 = null, y0 = null, moved = false;
  v.addEventListener('touchstart', e => {
    if(e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; moved = false;
  }, {passive:true});
  v.addEventListener('touchmove', e => {
    // 裏のページが動かないよう、ビューア上の縦移動も止める
    if(e.cancelable) e.preventDefault();
    if(x0 === null || e.touches.length !== 1) return;
    if(Math.abs(e.touches[0].clientX - x0) > 12) moved = true;
  }, {passive:false});
  v.addEventListener('touchend', e => {
    if(x0 === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
      vStep(dx < 0 ? 1 : -1);
    }else if(!moved){
      closeViewer();
    }
    x0 = null;
  });
  // マウス（PC確認用）
  v.addEventListener('click', e => {
    if(e.target.classList.contains('vnav')) return;
    closeViewer();
  });
})();
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
  unlockBody();
  render();
}

/* 背面のスクロールを止める。シートと画像ビューアで共用 */
let lockY = 0, lockDepth = 0;
function lockBody(){
  if(lockDepth++ > 0) return;      // 二重ロックを防ぐ
  lockY = window.scrollY;
  document.body.classList.add('noscroll');
  document.body.style.top = (-lockY) + 'px';
}
function unlockBody(){
  if(--lockDepth > 0) return;
  if(lockDepth < 0) lockDepth = 0;
  document.body.classList.remove('noscroll');
  document.body.style.top = '';
  window.scrollTo(0, lockY);
}
document.getElementById('scrim').addEventListener('click', closeSheet);

function exportText(){

  ).join('\n') : '（なし）';

  }
  const rowOf = id => allRows().find(r => r.id === id);
  t += `\n\n===== 3. 委託受け（${conIds.length}件）=====\n`;
  if(conIds.length){
    for(const nm of Object.keys(byName).sort()){
      t += `\n【${nm}】${byName[nm].length}件\n`;
      t += byName[nm].map(id => {
        const r = rowOf(id);

        return `  ${r.d}\t${r.p}\t${r.n}\t${ST[db.status[id]||0]}`;
      }).join('\n') + '\n';
    }
  }else{
    t += '（なし）';
  }

  t += `\n\n（1の列：日程／配置／サークル名／状況／メモ）\n`;
  t += `（2の列：日程／配置／サークル名／ホール／優先度／状況／開催回／メモ）\n`;

      <button class="btn b3" id="cl">閉じる</button>

  document.getElementById('scrim').classList.add('on');
  document.getElementById('cl').addEventListener('click', closeSheet);
  document.getElementById('cp').addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(t); document.getElementById('cp').textContent = 'コピーしました'; }
    catch(e){ document.getElementById('cp').textContent = '長押しで選択してください'; }
  });
}

const SORTS = [['place','配置順'], ['pri','優先度順'], ['ord','巡回順']];
document.getElementById('sortBtn').addEventListener('click', e => {
  const i = SORTS.findIndex(x => x[0] === sortMode);
  const nx = SORTS[(i + 1) % SORTS.length];
  sortMode = nx[0];
  e.target.textContent = nx[1];
  e.target.classList.toggle('on', sortMode !== 'place');
  render();
});
document.getElementById('hideBtn').addEventListener('click', e => {
  hideDone = !hideDone; e.target.classList.toggle('on', hideDone); render();
});
document.getElementById('themeBtn').addEventListener('click', e => {
  document.body.classList.toggle('light');
  e.target.textContent = document.body.classList.contains('light') ? '暗' : '明';
});

// 相対軸を1分ごとに再評価。シートや画像を開いている間は再描画しない
setInterval(function(){
  if(tab === 'ADD') return;
  if(document.getElementById('sheet').classList.contains('on')) return;
  if(document.getElementById('viewer').classList.contains('on')) return;
  if(document.activeElement && document.activeElement.id === 'q') return;
  render();
}, 60000);
// 復帰時（バックグラウンドから戻ったとき）にも即更新
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && tab !== 'ADD'
     && !document.getElementById('sheet').classList.contains('on')
     && !document.getElementById('viewer').classList.contains('on')) render();
});

window.addEventListener('error', function(ev){
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = 'エラー：' + ev.message + ' @' + (ev.lineno || '?');
});
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
render();
</script>
</body>
</html>
