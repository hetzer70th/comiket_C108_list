
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#E4E6E4">
<title>蔵書目録</title>
<style>
:root{
  /* 新聞紙のような冷たい灰、リソグラフの蛍光ピンクとフェデラルブルー */
  --paper:#E4E6E4;
  --card:#F2F3F1;
  --ink:#151A22;
  --ink-mute:#5F6873;
  --ink-faint:#8D959E;
  --rule:#C8CCC8;
  --pink:#F0316E;
  --blue:#2438A8;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  --gothic:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--gothic);font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}

/* ---------- 見出し ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 14px) 14px 0;
  border-bottom:1px solid var(--rule);
}
.masthead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
h1{
  font-family:var(--mincho);font-size:25px;font-weight:600;
  margin:0;letter-spacing:.18em;
}
.tally{
  font-size:11.5px;color:var(--ink-mute);font-variant-numeric:tabular-nums;
  letter-spacing:.06em;
}
.tally b{color:var(--pink);font-size:14px;font-weight:800}

#q{
  width:100%;padding:11px 12px;font-size:16px;font-family:var(--gothic);
  background:var(--card);color:var(--ink);
  border:1px solid var(--rule);border-radius:2px;
}
#q::placeholder{color:var(--ink-faint)}
#q:focus{outline:none;border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

.filters{display:flex;flex-wrap:wrap;gap:5px;padding:9px 0 11px}
.chip{
  font-size:11.5px;font-weight:700;letter-spacing:.03em;
  padding:5px 9px;border-radius:2px;cursor:pointer;
  background:transparent;color:var(--ink-mute);
  border:1px solid var(--rule);
}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.adult.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chip.clear{color:var(--blue);border-style:dashed}
.sep{width:1px;background:var(--rule);margin:2px 3px}


/* ---------- 並べ替え・統計の操作列 ---------- */
.bar{display:flex;align-items:center;gap:8px;padding:0 0 10px}
.axis{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.axis button{
  font-family:var(--gothic);font-size:11.5px;font-weight:700;letter-spacing:.03em;
  padding:5px 11px;border:none;background:transparent;color:var(--ink-mute);cursor:pointer;
}
.axis button + button{border-left:1px solid var(--rule)}
.axis button.on{background:var(--blue);color:var(--paper)}
#statsBtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- 統計 ---------- */
#stats:not(:empty){
  padding:14px 46px 18px 14px;border-bottom:1px solid var(--rule);
  background:var(--card);
}
.sgrid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.scard{
  flex:1 1 68px;background:var(--paper);border:1px solid var(--rule);
  padding:8px 10px;border-radius:2px;
}
.scard b{
  display:block;font-family:var(--mincho);font-size:22px;font-weight:600;
  color:var(--blue);line-height:1.1;font-variant-numeric:tabular-nums;
}
.scard b small{font-size:13px}
.scard span{font-size:10.5px;color:var(--ink-faint);letter-spacing:.05em}
.stitle{
  font-family:var(--mincho);font-size:13px;font-weight:600;letter-spacing:.1em;
  margin:16px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--pink);
  display:flex;align-items:baseline;gap:8px;
}
.stitle em{
  font-family:var(--gothic);font-style:normal;font-size:10px;
  color:var(--ink-faint);letter-spacing:.02em;font-weight:400;
}
.srow{display:flex;align-items:center;gap:8px;padding:2.5px 0}
.skey{
  flex:0 0 40%;font-size:11.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.sbar{flex:1;height:7px;background:rgba(200,204,200,.5);border-radius:1px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--pink)}
.sval{
  flex:0 0 24px;text-align:right;font-size:11px;color:var(--ink-mute);
  font-variant-numeric:tabular-nums;font-weight:700;
}
.sempty{font-size:11.5px;color:var(--ink-faint);padding:4px 0}
.snote{margin-top:16px;font-size:10.5px;color:var(--ink-faint);letter-spacing:.02em}

/* ---------- 目録 ---------- */
main{padding:0 46px 60px 14px}
.group{margin-top:22px}
.ghead{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:baseline;gap:9px;
  background:var(--paper);padding:7px 0 5px;
  border-bottom:2px solid var(--pink);
}
.gname{
  font-family:var(--mincho);font-size:17px;font-weight:600;
  letter-spacing:.03em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.gname.unset{color:var(--ink-faint);font-style:italic}
.gcount{
  font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums;
  letter-spacing:.05em;flex-shrink:0;
}
.item{
  padding:8px 0 7px;border-bottom:1px solid var(--rule);
}
.ttl{font-size:14.5px;font-weight:600;line-height:1.35}
.meta{
  display:flex;flex-wrap:wrap;gap:0 7px;margin-top:2px;
  font-size:11px;color:var(--ink-mute);letter-spacing:.02em;
}
.au{color:var(--blue);font-weight:700}
.gn{font-family:var(--mincho);letter-spacing:.04em}
.ad{color:var(--pink);font-weight:800}
mark{background:rgba(240,49,110,.22);color:inherit;padding:0 1px;border-radius:1px}

.none{
  padding:52px 6px;text-align:center;color:var(--ink-mute);
  font-family:var(--mincho);font-size:15px;letter-spacing:.06em;
}
.none span{display:block;margin-top:8px;font-family:var(--gothic);font-size:12px;color:var(--ink-faint);letter-spacing:0}

/* ---------- ツメ（索引） ---------- */
#rail{
  position:fixed;right:0;top:0;bottom:0;width:34px;z-index:30;
  display:flex;flex-direction:column;justify-content:center;align-items:stretch;
  padding:env(safe-area-inset-top) 3px env(safe-area-inset-bottom) 0;
  background:linear-gradient(to left, rgba(228,230,228,.96), rgba(228,230,228,.72));
  border-left:1px solid var(--rule);
}
#rail button{
  flex:1 1 0;min-height:0;border:none;background:none;cursor:pointer;
  font-family:var(--gothic);font-size:10px;font-weight:800;
  color:var(--ink-mute);padding:0;line-height:1;
  border-radius:2px 0 0 2px;
}
#rail button.hit{color:var(--ink)}
#rail button.off{color:#C0C5C0}
#rail button:active{background:var(--pink);color:#fff}

@media (min-width:620px){
  main{padding-left:24px;padding-right:56px}
  .item{padding:9px 0}
}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
}
</style>
</head>

  if(safeOnly && r.k.indexOf('成人向け') !== -1) return false;
  for(const p of picked){
    if(r.k.indexOf(p) === -1 && r.g.indexOf(p) === -1) return false;
  }
  if(!query) return true;
  return norm(r.t + ' ' + r.c + ' ' + r.a).indexOf(query) !== -1;
}
function esc(s){
  return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function hl(s){
  if(!query) return esc(s);
  const i = norm(s).indexOf(query);
  if(i < 0) return esc(s);
  return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + query.length)) + '</mark>' + esc(s.slice(i + query.length));
}

/* ---------- 統計 ---------- */
function tally(rows, fn){
  const m = new Map();
  for(const r of rows) for(const v of fn(r)) if(v) m.set(v, (m.get(v)||0) + 1);
  return [...m.entries()].sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0],'ja'));
}
function bars(pairs, top){
  const list = top ? pairs.slice(0, top) : pairs;
  if(!list.length) return '<div class="sempty">該当なし</div>';
  const max = list[0][1];
  return list.map(([k,v]) =>
    `<div class="srow">
       <div class="skey">${esc(k)}</div>
       <div class="sbar"><i style="width:${Math.max(3, v/max*100)}%"></i></div>
       <div class="sval">${v}</div>
     </div>`).join('');
}
function renderStats(rows){
  const box = document.getElementById('stats');
  if(!statsOpen){ box.innerHTML = ''; return; }

  const circles = tally(rows, r => [r.c]);
  const authors = tally(rows, r => [r.a]);
  const genres  = tally(rows, r => r.g);
  const tags    = tally(rows, r => r.k.filter(x => x !== '成人向け' && x !== '全年齢'));
  const adult   = rows.filter(r => r.k.indexOf('成人向け') !== -1).length;
  const orig    = rows.filter(r => !r.g.length).length;
  const noCircle = rows.filter(r => !r.c).length;
  const noAuthor = rows.filter(r => !r.a).length;

  box.innerHTML = `
    <div class="sgrid">
      <div class="scard"><b>${rows.length}</b><span>冊</span></div>
      <div class="scard"><b>${circles.length}</b><span>サークル</span></div>
      <div class="scard"><b>${authors.length}</b><span>作者</span></div>
      <div class="scard"><b>${(adult/Math.max(1,rows.length)*100).toFixed(0)}<small>%</small></b><span>成人向け</span></div>
    </div>

    <div class="stitle">よく買っているサークル</div>
    ${bars(circles, 12)}

    <div class="stitle">よく買っている作者</div>
    ${bars(authors, 12)}

    <div class="stitle">ジャンル<em>ジャンルなし ${orig} 冊（ほぼオリジナル）</em></div>
    ${bars(genres)}

    <div class="stitle">種別</div>
    ${bars(tags)}

    <div class="snote">サークル名の空欄 ${noCircle} 冊、作者名の空欄 ${noAuthor} 冊。</div>
  `;
}

/* ---------- 描画 ---------- */
function render(){
  const rows = DATA.filter(hit);
  const unit = axis === 'c' ? 'サークル' : '作者';
  document.getElementById('tally').innerHTML =
    `<b>${rows.length}</b>冊 / ${new Set(rows.map(keyOf).filter(Boolean)).size}${unit}`;

  renderStats(rows);

  const list = document.getElementById('list');
  if(!rows.length){
    list.innerHTML = `<div class="none">該当なし<span>検索語を短くするか、絞り込みを外してください</span></div>`;
    paintRail(new Set());
    return;
  }

  const groups = new Map();
  for(const r of rows){
    const k = keyOf(r) || '\u0000';
    if(!groups.has(k)) groups.set(k, { name: keyOf(r), b: bucketOf(r), items: [] });
    groups.get(k).items.push(r);
  }
  const sorted = [...groups.values()].sort((a, b) => {
    const d = ORDER.indexOf(a.b) - ORDER.indexOf(b.b);
    if(d) return d;
    return a.name.localeCompare(b.name, 'ja');
  });

  let html = '', seen = new Set(), live = new Set();
  for(const g of sorted){
    if(!seen.has(g.b)){
      seen.add(g.b); live.add(g.b);
      html += `<div id="b-${encodeURIComponent(g.b)}" style="height:1px"></div>`;
    }
    const blank = axis === 'c' ? 'サークル名なし' : '作者名なし';
    html += `<section class="group">
      <div class="ghead">
        <div class="gname${g.name ? '' : ' unset'}">${g.name ? hl(g.name) : blank}</div>
        <div class="gcount">${g.items.length}</div>
      </div>`;
    for(const r of g.items.sort((x, y) => x.t.localeCompare(y.t, 'ja'))){
      const bits = [];
      // 束ねている軸は見出しに出ているので、行では反対側を見せる
      const sub = axis === 'c' ? r.a : r.c;
      if(sub) bits.push(`<span class="au">${hl(sub)}</span>`);
      if(r.g.length) bits.push(`<span class="gn">${esc(r.g.join('・'))}</span>`);
      const kk = r.k.filter(x => x !== '成人向け' && x !== '全年齢');
      if(kk.length) bits.push(`<span>${esc(kk.join('・'))}</span>`);
      if(r.k.indexOf('成人向け') !== -1) bits.push(`<span class="ad">R18</span>`);
      html += `<div class="item">
        <div class="ttl">${hl(r.t)}</div>
        <div class="meta">${bits.join('')}</div>
      </div>`;
    }
    html += `</section>`;
  }
  list.innerHTML = html;
  paintRail(live);
}

/* ---------- ツメ ---------- */
function paintRail(live){
  const rail = document.getElementById('rail');
  if(!rail.dataset.built){
    rail.innerHTML = ORDER.map(b =>
      `<button data-b="${esc(b)}" aria-label="${esc(b)}へ移動">${esc(b)}</button>`).join('');
    rail.dataset.built = '1';
    rail.addEventListener('click', e => {
      const b = e.target.dataset && e.target.dataset.b;
      if(!b) return;
      const t = document.getElementById('b-' + encodeURIComponent(b));
      if(t) t.scrollIntoView({ block: 'start' });
    });
  }
  rail.querySelectorAll('button').forEach(b => {
    const on = live.has(b.dataset.b);
    b.classList.toggle('hit', on);
    b.classList.toggle('off', !on);
  });
}

/* ---------- 上部の操作 ---------- */
function buildBar(){
  const bar = document.getElementById('bar');
  bar.innerHTML = `
    <div class="axis" role="group" aria-label="並べ方">
      <button data-axis="c" class="on">サークル順</button>
      <button data-axis="a">作者順</button>
    </div>
    <button id="statsBtn" class="chip">統計</button>`;
  bar.addEventListener('click', e => {
    const b = e.target.closest('button');
    if(!b) return;
    if(b.id === 'statsBtn'){
      statsOpen = !statsOpen;
      b.classList.toggle('on', statsOpen);
      render(); return;
    }
    if(b.dataset.axis && b.dataset.axis !== axis){
      axis = b.dataset.axis;
      bar.querySelectorAll('.axis button').forEach(x =>
        x.classList.toggle('on', x.dataset.axis === axis));
      render();
      window.scrollTo({ top: 0 });
    }
  });
}

/* ---------- 絞り込み ---------- */
function buildFilters(){
  const f = document.getElementById('filters');
  const counts = {};
  for(const r of DATA){
    for(const x of r.k.concat(r.g)) counts[x] = (counts[x] || 0) + 1;
  }
  let h = `<button class="chip adult" data-safe="1">全年齢のみ</button><div class="sep"></div>`;
  h += TAGS.filter(t => counts[t]).map(t =>
    `<button class="chip" data-p="${esc(t)}">${esc(t)}</button>`).join('');
  h += `<div class="sep"></div>`;
  h += GENRES.filter(g => counts[g]).map(g =>
    `<button class="chip" data-p="${esc(g)}">${esc(g)} <span style="opacity:.5">${counts[g]}</span></button>`).join('');
  h += `<button class="chip clear" data-clear="1">解除</button>`;
  f.innerHTML = h;

  f.addEventListener('click', e => {
    const b = e.target.closest('button');
    if(!b) return;
    if(b.dataset.clear){
      picked.clear(); safeOnly = false;
      f.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
      render(); return;
    }
    if(b.dataset.safe){
      safeOnly = !safeOnly; b.classList.toggle('on', safeOnly); render(); return;
    }
    const p = b.dataset.p;
    if(picked.has(p)) picked.delete(p); else picked.add(p);
    b.classList.toggle('on', picked.has(p));
    render();
  });
}

document.getElementById('q').addEventListener('input', e => {
  query = norm(e.target.value.trim());
  render();
});

buildBar();
buildFilters();
render();
</script>
</body>
</html>
